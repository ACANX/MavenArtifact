name: SyncBadgeSvg

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: CheckoutRepository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ConfigureGit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SyncOrInitializeBadgeBranch
        run: |
          # 检查远程是否存在 badge 分支
          if git ls-remote --heads origin badge | grep -q badge; then
            echo "🔄 badge 分支已存在，开始增量同步..."

            git fetch origin

            latest_commit=$(git rev-parse origin/latest)
            badge_commit=$(git rev-parse origin/badge)

            # 获取 badge 与 latest 之间新增或修改的文件，并过滤出 Badge/ 下的 .svg（递归）
            git diff --name-only --diff-filter=AM $badge_commit $latest_commit | grep '^Badge/.*\.svg$' > /tmp/sync_files.txt

            if [ ! -s /tmp/sync_files.txt ]; then
              echo "✅ 没有需要同步的新增或修改的 SVG 文件。"
              exit 0
            fi

            echo "📦 待同步的文件列表："
            cat /tmp/sync_files.txt

            # ---------- 更新 badge 分支 ----------
            git checkout badge
            while IFS= read -r file; do
              git checkout origin/latest -- "$file"
            done < /tmp/sync_files.txt

            if git diff --quiet; then
              echo "ℹ️ badge 分支无变更（文件内容已一致）。"
            else
              git add .
              git commit -m "从 latest 同步 SVG 文件 [skip ci]"
              git push origin badge
              echo "✅ badge 分支已更新。"
            fi

            # ---------- 从 latest 删除已同步文件 ----------
            git checkout latest
            while IFS= read -r file; do
              git rm --ignore-unmatch "$file"
            done < /tmp/sync_files.txt

            if git diff --cached --quiet; then
              echo "ℹ️ latest 分支没有需要删除的文件（可能已被删除）。"
            else
              git commit -m "移除已同步到 badge 的 SVG 文件 [skip ci]"
              git push origin latest
              echo "✅ latest 分支已清理。"
            fi

          else
            echo "🆕 badge 分支不存在，开始初始化..."

            # 递归获取 latest 上 Badge/ 下所有 .svg 文件
            git ls-tree -r origin/latest --name-only | grep '^Badge/.*\.svg$' > /tmp/init_files.txt 2>/dev/null

            if [ ! -s /tmp/init_files.txt ]; then
              echo "ℹ️ Badge/ 目录下没有 SVG 文件，将创建一个空的 badge 分支。"
              git checkout --orphan badge
              git commit --allow-empty -m "初始化空的 badge 分支 [skip ci]"
              git push origin badge
              echo "✅ 空的 badge 分支已创建。"
              exit 0
            fi

            # 创建孤立分支并检出所有 .svg 文件
            git checkout --orphan badge
            while IFS= read -r file; do
              git checkout origin/latest -- "$file"
            done < /tmp/init_files.txt

            git add .
            git commit -m "初始创建 badge 分支，包含所有 SVG 文件 [skip ci]"
            git push origin badge
            echo "✅ badge 分支已创建。"

            # 从 latest 删除已迁移的 .svg 文件
            git checkout latest
            while IFS= read -r file; do
              git rm --ignore-unmatch "$file"
            done < /tmp/init_files.txt

            if git diff --cached --quiet; then
              echo "⚠️ latest 分支没有文件被删除（可能已经不存在）。"
            else
              git commit -m "删除已迁移到 badge 的初始 SVG 文件 [skip ci]"
              git push origin latest
              echo "✅ latest 分支已清理。"
            fi
          fi
